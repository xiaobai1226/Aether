# Gradle Version Catalog
# 用于统一管理项目依赖版本

[versions]
# 框架版本
solon = "3.8.1-M5"
mybatis-plus = "3.5.14"

# 工具库版本
lombok = "1.18.42"
hutool = "5.8.43"
jaffree = "2024.08.29"
caffeine = "3.2.3"

# 数据库相关版本
hikaricp = "7.0.2"
mysql-connector = "9.5.0"

[libraries]
# Solon 框架相关
solon-parent = { module = "org.noear:solon-parent", version.ref = "solon" }
solon-web = { module = "org.noear:solon-web" }
solon-web-webdav = { module = "org.noear:solon-web-webdav", version.ref = "solon" }
solon-logging-logback = { module = "org.noear:solon-logging-logback" }
solon-satoken-plugin = { module = "org.noear:sa-token-solon-plugin" }
solon-scheduling-simple = { module = "org.noear:solon-scheduling-simple" }

# MyBatis Plus 相关
mybatis-plus-bom = { module = "com.baomidou:mybatis-plus-bom", version.ref = "mybatis-plus" }
mybatis-plus-solon-plugin = { module = "com.baomidou:mybatis-plus-solon-plugin" }
mybatis-plus-jsqlparser = { module = "com.baomidou:mybatis-plus-jsqlparser" }

# 工具库
hutool-all = { module = "cn.hutool:hutool-all", version.ref = "hutool" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
jaffree = { module = "com.github.kokorin.jaffree:jaffree", version.ref = "jaffree" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }

# 数据库相关
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql-connector" }

# 日志相关
slf4j-api = { module = "org.slf4j:slf4j-api" }

[bundles]
# Solon Web 基础组件（可选，将常用的依赖打包成组）
# solon-web-base = ["solon-web", "solon-boot-jetty", "solon-logging-logback"]