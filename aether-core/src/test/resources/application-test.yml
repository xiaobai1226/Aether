# 测试环境配置

# 项目路径配置
project:
  path:
    root: /tmp/aether-test

# 数据库配置（使用H2内存数据库进行测试）
solon.dataSources:
  test:
    schema: test
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driverClassName: org.h2.Driver

# 日志配置
logging:
  level:
    root: INFO
    com.xiaobai1226.aether: DEBUG